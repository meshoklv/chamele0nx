# TCP tuning for a Chamele0nX server.
#
#   sudo cp deploy/sysctl/99-chamele0nx-tcp.conf /etc/sysctl.d/
#   echo tcp_bbr | sudo tee /etc/modules-load.d/bbr.conf
#   sudo modprobe tcp_bbr && sudo sysctl --system
#
# Why this matters more than any protocol tweak: on a lossy long-haul
# path (the usual case for a censored client reaching a foreign VPS)
# the default CUBIC congestion control collapses. Switching to BBR with
# larger socket buffers measured 3.5 -> 22 Mbit/s on one such path in
# August 2026, with no change to the protocol at all.

# BBR needs fq (or fq_codel) as the queueing discipline.
net.core.default_qdisc = fq
net.ipv4.tcp_congestion_control = bbr

# Large buffers so a single long-haul flow can fill a fat pipe.
net.core.rmem_max = 16777216
net.core.wmem_max = 16777216
net.ipv4.tcp_rmem = 4096 262144 16777216
net.ipv4.tcp_wmem = 4096 262144 16777216

# Probe for a working MTU instead of blackholing on broken PMTUD paths.
net.ipv4.tcp_mtu_probing = 1

# Keep the kernel send queue short so shaping decisions are not
# swallowed by a multi-megabyte backlog.
net.ipv4.tcp_notsent_lowat = 131072
