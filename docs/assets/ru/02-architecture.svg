<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="924" viewBox="0 0 1180 924" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, Helvetica, Arial, sans-serif"><defs><marker id="ar6b7280" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#6b7280"/></marker><marker id="ar2f6feb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#2f6feb"/></marker><marker id="ar1f9d63" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#1f9d63"/></marker><marker id="ard1495b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#d1495b"/></marker></defs><rect width="1180" height="924" fill="#fbfbfd"/><text x="44.0" y="52.0" font-size="26" fill="#16181d" font-weight="700">Как проходит запрос</text><text x="44.0" y="80.0" font-size="15" fill="#6b7280">Одно и то же соединение — и работающий сайт, и туннель VPN. Что именно вы получите, зависит от того, есть ли у вас секрет.</text><rect x="44.0" y="113.0" width="356.0" height="672.0" fill="#ffffff" stroke="#d9dde3" rx="12"/><text x="68.0" y="151.0" font-size="17" fill="#16181d" font-weight="700">Клиент</text><rect x="64.0" y="175.0" width="316.0" height="61.0" fill="#f4f6fa" stroke="#d9dde3" rx="8"/><text x="80.0" y="203.0" font-size="14" fill="#16181d" font-weight="700">Приложение</text><text x="80.0" y="219.0" font-size="12" fill="#6b7280">браузер, мессенджер, что угодно</text><line x1="222.0" y1="240.0" x2="222.0" y2="250.0" stroke="#6b7280" stroke-width="1.4" marker-end="url(#ar6b7280)"/><rect x="64.0" y="254.0" width="316.0" height="61.0" fill="#f4f6fa" stroke="#d9dde3" rx="8"/><text x="80.0" y="282.0" font-size="14" fill="#16181d" font-weight="700">SOCKS5 или пакетный туннель</text><text x="80.0" y="298.0" font-size="12" fill="#6b7280">принимаются и TCP, и UDP</text><line x1="222.0" y1="319.0" x2="222.0" y2="329.0" stroke="#6b7280" stroke-width="1.4" marker-end="url(#ar6b7280)"/><rect x="64.0" y="333.0" width="316.0" height="61.0" fill="#f4f6fa" stroke="#d9dde3" rx="8"/><text x="80.0" y="361.0" font-size="14" fill="#16181d" font-weight="700">Мультиплексор</text><text x="80.0" y="377.0" font-size="12" fill="#6b7280">много логических потоков в одном туннеле</text><line x1="222.0" y1="398.0" x2="222.0" y2="408.0" stroke="#6b7280" stroke-width="1.4" marker-end="url(#ar6b7280)"/><rect x="64.0" y="412.0" width="316.0" height="78.0" fill="#f4f6fa" stroke="#d9dde3" rx="8"/><text x="80.0" y="440.0" font-size="14" fill="#16181d" font-weight="700">Шифрование</text><text x="80.0" y="456.0" font-size="12" fill="#6b7280">обмен X25519, затем AES-256-GCM на</text><text x="80.0" y="473.0" font-size="12" fill="#6b7280">каждый кадр</text><line x1="222.0" y1="494.0" x2="222.0" y2="504.0" stroke="#6b7280" stroke-width="1.4" marker-end="url(#ar6b7280)"/><rect x="64.0" y="508.0" width="316.0" height="78.0" fill="#f4f6fa" stroke="#d9dde3" rx="8"/><text x="80.0" y="536.0" font-size="14" fill="#16181d" font-weight="700">Прикрытие</text><text x="80.0" y="552.0" font-size="12" fill="#6b7280">кадры едут внутри HTTP/2 POST на</text><text x="80.0" y="569.0" font-size="12" fill="#6b7280">реальный путь API</text><line x1="222.0" y1="590.0" x2="222.0" y2="600.0" stroke="#6b7280" stroke-width="1.4" marker-end="url(#ar6b7280)"/><rect x="64.0" y="604.0" width="316.0" height="78.0" fill="#f4f6fa" stroke="#d9dde3" rx="8"/><text x="80.0" y="632.0" font-size="14" fill="#16181d" font-weight="700">Формовка записей</text><text x="80.0" y="648.0" font-size="12" fill="#6b7280">размеры и паузы берутся из профиля</text><text x="80.0" y="665.0" font-size="12" fill="#6b7280">трафика</text><line x1="222.0" y1="686.0" x2="222.0" y2="696.0" stroke="#6b7280" stroke-width="1.4" marker-end="url(#ar6b7280)"/><rect x="64.0" y="700.0" width="316.0" height="61.0" fill="#f4f6fa" stroke="#d9dde3" rx="8"/><text x="80.0" y="728.0" font-size="14" fill="#16181d" font-weight="700">uTLS</text><text x="80.0" y="744.0" font-size="12" fill="#6b7280">побайтово точное рукопожатие Chrome</text><rect x="780.0" y="113.0" width="356.0" height="672.0" fill="#ffffff" stroke="#d9dde3" rx="12"/><text x="804.0" y="151.0" font-size="17" fill="#16181d" font-weight="700">Сервер</text><rect x="800.0" y="175.0" width="316.0" height="114.7" fill="#f4f6fa" stroke="#d9dde3" rx="8"/><text x="816.0" y="221.4" font-size="14" fill="#16181d" font-weight="700">Терминация TLS</text><text x="816.0" y="237.4" font-size="12" fill="#6b7280">порт 443, настоящий сертификат</text><text x="816.0" y="254.4" font-size="12" fill="#6b7280">настоящего домена</text><line x1="958.0" y1="293.7" x2="958.0" y2="333.8" stroke="#6b7280" stroke-width="1.4" marker-end="url(#ar6b7280)"/><rect x="800.0" y="337.8" width="316.0" height="114.7" fill="#f4f6fa" stroke="#d9dde3" rx="8"/><text x="816.0" y="384.1" font-size="14" fill="#16181d" font-weight="700">Есть ли верная сессионная кука?</text><text x="816.0" y="400.1" font-size="12" fill="#6b7280">HMAC по пятиминутному интервалу,</text><text x="816.0" y="417.1" font-size="12" fill="#6b7280">проверка за равное время</text><line x1="958.0" y1="456.5" x2="958.0" y2="496.5" stroke="#6b7280" stroke-width="1.4" marker-end="url(#ar6b7280)"/><rect x="800.0" y="500.5" width="316.0" height="97.7" fill="#f1f6ff" stroke="#2f6feb" stroke-opacity="0.6" rx="8"/><text x="816.0" y="546.9" font-size="14" fill="#16181d" font-weight="700">Нет: отдаём сайт</text><text x="816.0" y="562.9" font-size="12" fill="#6b7280">статика, обычные ответы, обычные 404</text><line x1="958.0" y1="602.2" x2="958.0" y2="642.3" stroke="#6b7280" stroke-width="1.4" marker-end="url(#ar6b7280)"/><rect x="800.0" y="646.3" width="316.0" height="114.7" fill="#f0fbf5" stroke="#1f9d63" stroke-opacity="0.6" rx="8"/><text x="816.0" y="692.6" font-size="14" fill="#16181d" font-weight="700">Да: отдаём туннель</text><text x="816.0" y="708.6" font-size="12" fill="#6b7280">расшифровать, разобрать потоки, открыть</text><text x="816.0" y="725.6" font-size="12" fill="#6b7280">TCP и UDP наружу</text><rect x="440.0" y="290.0" width="300.0" height="318.0" fill="#fff7ed" stroke="#b7791f" stroke-opacity="0.45" rx="12"/><text x="590.0" y="324.0" font-size="15" fill="#b7791f" font-weight="700" text-anchor="middle">Цензор посередине</text><text x="458.0" y="362.0" font-size="12.5" fill="#16181d" font-weight="700">Что он видит:</text><text x="458.0" y="388.0" font-size="12.5" fill="#6b7280">• соединение TLS 1.3 к настоящему</text><text x="469.4" y="406.0" font-size="12.5" fill="#6b7280">домену с действующим</text><text x="469.4" y="424.0" font-size="12.5" fill="#6b7280">сертификатом</text><text x="458.0" y="452.0" font-size="12.5" fill="#6b7280">• отпечаток рукопожатия Chrome</text><text x="458.0" y="480.0" font-size="12.5" fill="#6b7280">• размеры записей и паузы, как при</text><text x="469.4" y="498.0" font-size="12.5" fill="#6b7280">обычном просмотре сайтов</text><text x="458.0" y="542.0" font-size="12.5" fill="#16181d" font-weight="700">Чего он не видит:</text><text x="458.0" y="568.0" font-size="12.5" fill="#6b7280">• что всё это вообще туннель</text><line x1="408.0" y1="449.0" x2="432.0" y2="449.0" stroke="#6b7280" stroke-width="2" marker-end="url(#ar6b7280)"/><line x1="748.0" y1="449.0" x2="772.0" y2="449.0" stroke="#6b7280" stroke-width="2" marker-end="url(#ar6b7280)"/><rect x="44.0" y="819.0" width="1092.0" height="71.0" fill="#ffffff" stroke="#d9dde3" rx="10"/><text x="70.0" y="849.0" font-size="14" fill="#16181d" font-weight="700">Суть</text><text x="70.0" y="871.0" font-size="13" fill="#6b7280">Активная проба, пришедшая без секрета, не получает ни отказа, ни перенаправления. Ей отдают сайт, потому что сайт там действительно есть.</text></svg>