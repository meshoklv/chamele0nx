<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="896" viewBox="0 0 1180 896" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, Helvetica, Arial, sans-serif"><defs><marker id="ar6b7280" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#6b7280"/></marker><marker id="ar2f6feb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#2f6feb"/></marker><marker id="ar1f9d63" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#1f9d63"/></marker><marker id="ard1495b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#d1495b"/></marker></defs><rect width="1180" height="896" fill="#fbfbfd"/><text x="44.0" y="52.0" font-size="26" fill="#16181d" font-weight="700">Что находится внутри байта на проводе</text><text x="44.0" y="80.0" font-size="15" fill="#6b7280">Пять слоёв обёртки. Снаружи виден только самый внешний.</text><rect x="60.0" y="113.0" width="1060.0" height="367.0" fill="#eef2f7" stroke="#d9dde3" stroke-opacity="0.55" rx="10"/><text x="78.0" y="139.0" font-size="13.5" fill="#16181d" font-weight="700">Сегмент TCP на порту 443</text><rect x="86.0" y="153.0" width="1008.0" height="301.0" fill="#e8f0fe" stroke="#2f6feb" stroke-opacity="0.55" rx="10"/><text x="104.0" y="179.0" font-size="13.5" fill="#16181d" font-weight="700">Запись TLS 1.3 — размер и момент выбирает профиль формовки, а не фиксированные 16 КБ</text><rect x="112.0" y="193.0" width="956.0" height="235.0" fill="#f3eefc" stroke="#6b46c1" stroke-opacity="0.55" rx="10"/><text x="130.0" y="219.0" font-size="13.5" fill="#16181d" font-weight="700">Кадр HTTP/2 DATA в открытом теле POST</text><text x="130.0" y="238.0" font-size="12" fill="#6b7280">тело запроса везёт от клиента к серверу, тело ответа — от сервера к клиенту</text><rect x="138.0" y="250.0" width="904.0" height="152.0" fill="#e9f7f0" stroke="#1f9d63" stroke-opacity="0.55" rx="10"/><text x="156.0" y="276.0" font-size="13.5" fill="#16181d" font-weight="700">Кадр Chamele0nX</text><text x="158.0" y="306.0" font-size="12.5" fill="#6b7280">старший байт первым, отправляется одной записью:</text><rect x="158.0" y="320.0" width="150.0" height="56.0" fill="#dbe7ff" stroke="#d9dde3" rx="6"/><text x="233.0" y="344.0" font-size="13" fill="#16181d" font-weight="700" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">тип</text><text x="233.0" y="363.0" font-size="11.5" fill="#6b7280" text-anchor="middle">2 байта</text><rect x="314.0" y="320.0" width="160.0" height="56.0" fill="#dbe7ff" stroke="#d9dde3" rx="6"/><text x="394.0" y="344.0" font-size="13" fill="#16181d" font-weight="700" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">длина</text><text x="394.0" y="363.0" font-size="11.5" fill="#6b7280" text-anchor="middle">4 байта</text><rect x="480.0" y="320.0" width="542.0" height="56.0" fill="#cdebdd" stroke="#d9dde3" rx="6"/><text x="751.0" y="344.0" font-size="13" fill="#16181d" font-weight="700" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">нагрузка</text><text x="751.0" y="363.0" font-size="11.5" fill="#6b7280" text-anchor="middle">до 64 КБ</text><text x="44.0" y="524.0" font-size="17" fill="#16181d" font-weight="700">Что внутри кадра данных</text><rect x="44.0" y="542.0" width="534.0" height="134.0" fill="#ffffff" stroke="#d9dde3" rx="10"/><text x="68.0" y="574.0" font-size="13.5" fill="#16181d" font-weight="700">полезная нагрузка кадра данных</text><text x="68.0" y="600.0" font-size="12.5" fill="#0f766e" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">nonce (12 Б) ‖ шифртекст AES-256-GCM ‖ тег</text><text x="68.0" y="626.0" font-size="12.5" fill="#6b7280">ключ получен из обмена X25519, живёт только в памяти и затирается</text><text x="68.0" y="644.0" font-size="12.5" fill="#6b7280">при закрытии туннеля</text><rect x="602.0" y="542.0" width="534.0" height="134.0" fill="#ffffff" stroke="#d9dde3" rx="10"/><text x="626.0" y="574.0" font-size="13.5" fill="#16181d" font-weight="700">после расшифровки: кадр мультиплексора</text><text x="626.0" y="600.0" font-size="12.5" fill="#0f766e" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">id потока (4 Б) ‖ тип потока (1 Б) ‖ данные</text><text x="626.0" y="626.0" font-size="12.5" fill="#6b7280">много соединений приложения делят один туннель, поэтому цензор</text><text x="626.0" y="644.0" font-size="12.5" fill="#6b7280">всегда видит одну TLS-сессию</text><text x="44.0" y="720.0" font-size="17" fill="#16181d" font-weight="700">Типы потоков</text><rect x="44.0" y="738.0" width="354.7" height="51.0" fill="#ffffff" stroke="#d9dde3" rx="7"/><text x="58.0" y="757.0" font-size="12" fill="#0f766e" font-weight="700" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">0x01  CONNECT</text><text x="58.0" y="774.0" font-size="11.5" fill="#6b7280">открыть поток TCP на узел и порт</text><rect x="412.7" y="738.0" width="354.7" height="51.0" fill="#ffffff" stroke="#d9dde3" rx="7"/><text x="426.7" y="757.0" font-size="12" fill="#0f766e" font-weight="700" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">0x02  DATA</text><text x="426.7" y="774.0" font-size="11.5" fill="#6b7280">байты для открытого потока</text><rect x="781.3" y="738.0" width="354.7" height="51.0" fill="#ffffff" stroke="#d9dde3" rx="7"/><text x="795.3" y="757.0" font-size="12" fill="#0f766e" font-weight="700" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">0x03  FIN</text><text x="795.3" y="774.0" font-size="11.5" fill="#6b7280">эта сторона закончила передачу</text><rect x="44.0" y="801.0" width="354.7" height="51.0" fill="#ffffff" stroke="#d9dde3" rx="7"/><text x="58.0" y="820.0" font-size="12" fill="#0f766e" font-weight="700" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">0x04  RST</text><text x="58.0" y="837.0" font-size="11.5" fill="#6b7280">поток оборвался с ошибкой</text><rect x="412.7" y="801.0" width="354.7" height="51.0" fill="#ffffff" stroke="#d9dde3" rx="7"/><text x="426.7" y="820.0" font-size="12" fill="#0f766e" font-weight="700" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">0x05  CONNECT_UDP</text><text x="426.7" y="837.0" font-size="11.5" fill="#6b7280">открыть ассоциацию UDP</text><rect x="781.3" y="801.0" width="354.7" height="51.0" fill="#ffffff" stroke="#d9dde3" rx="7"/><text x="795.3" y="820.0" font-size="12" fill="#0f766e" font-weight="700" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">0x06  DATAGRAM</text><text x="795.3" y="837.0" font-size="11.5" fill="#6b7280">один кадр — ровно одна датаграмма UDP</text></svg>