<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="1191" viewBox="0 0 1180 1191" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, Helvetica, Arial, sans-serif"><defs><marker id="ar6b7280" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#6b7280"/></marker><marker id="ar2f6feb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#2f6feb"/></marker><marker id="ar1f9d63" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#1f9d63"/></marker><marker id="ard1495b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#d1495b"/></marker></defs><rect width="1180" height="1191" fill="#fbfbfd"/><text x="44.0" y="52.0" font-size="26" fill="#16181d" font-weight="700">Подключение по шагам</text><text x="44.0" y="80.0" font-size="15" fill="#6b7280">Нет ни формы входа, ни собственного рукопожатия до TLS. Всё до проверки куки — обычная загрузка HTTPS-страницы.</text><rect x="110.0" y="113.0" width="200.0" height="46.0" fill="#ffffff" stroke="#d9dde3" rx="9"/><text x="210.0" y="143.0" font-size="15" fill="#16181d" font-weight="700" text-anchor="middle">Клиент</text><rect x="870.0" y="113.0" width="200.0" height="46.0" fill="#ffffff" stroke="#d9dde3" rx="9"/><text x="970.0" y="143.0" font-size="15" fill="#16181d" font-weight="700" text-anchor="middle">Сервер</text><text x="590.0" y="219.0" font-size="13.5" fill="#16181d" font-weight="700" text-anchor="middle">TCP-соединение на порт 443</text><line x1="210.0" y1="233.0" x2="970.0" y2="233.0" stroke="#2f6feb" stroke-width="1.9" marker-end="url(#ar2f6feb)"/><circle cx="76" cy="233.0" r="15" fill="#ffffff" stroke="#d9dde3"/><text x="76.0" y="238.0" font-size="12.5" fill="#6b7280" text-anchor="middle">1</text><text x="590.0" y="257.0" font-size="12.5" fill="#6b7280" text-anchor="middle">ничего необычного: этот порт использует любой сайт</text><text x="590.0" y="297.0" font-size="13.5" fill="#16181d" font-weight="700" text-anchor="middle">TLS ClientHello</text><line x1="210.0" y1="311.0" x2="970.0" y2="311.0" stroke="#2f6feb" stroke-width="1.9" marker-end="url(#ar2f6feb)"/><circle cx="76" cy="311.0" r="15" fill="#ffffff" stroke="#d9dde3"/><text x="76.0" y="316.0" font-size="12.5" fill="#6b7280" text-anchor="middle">2</text><text x="590.0" y="335.0" font-size="12.5" fill="#6b7280" text-anchor="middle">сделан через uTLS, побайтово как у настоящего Chrome; в SNI — настоящий домен</text><text x="590.0" y="375.0" font-size="13.5" fill="#16181d" font-weight="700" text-anchor="middle">ServerHello и сертификат</text><line x1="970.0" y1="389.0" x2="210.0" y2="389.0" stroke="#1f9d63" stroke-width="1.9" marker-end="url(#ar1f9d63)"/><circle cx="76" cy="389.0" r="15" fill="#ffffff" stroke="#d9dde3"/><text x="76.0" y="394.0" font-size="12.5" fill="#6b7280" text-anchor="middle">3</text><text x="590.0" y="413.0" font-size="12.5" fill="#6b7280" text-anchor="middle">настоящий сертификат настоящего домена, выданный публичным центром</text><text x="590.0" y="453.0" font-size="13.5" fill="#16181d" font-weight="700" text-anchor="middle">HTTP/2 POST /api/v1/events</text><line x1="210.0" y1="467.0" x2="970.0" y2="467.0" stroke="#2f6feb" stroke-width="1.9" marker-end="url(#ar2f6feb)"/><circle cx="76" cy="467.0" r="15" fill="#ffffff" stroke="#d9dde3"/><text x="76.0" y="472.0" font-size="12.5" fill="#6b7280" text-anchor="middle">4</text><text x="590.0" y="491.0" font-size="12.5" fill="#6b7280" text-anchor="middle">Cookie: wordpress_logged_in_&lt;хеш&gt;=&lt;токен&gt; — порядок заголовков и User-Agent как у Chrome</text><rect x="452.1" y="513.0" width="275.9" height="64.0" fill="#fffaf0" stroke="#b7791f" stroke-opacity="0.55" rx="9"/><text x="590.0" y="540.0" font-size="14" fill="#16181d" font-weight="700" text-anchor="middle">сервер проверяет куку</text><text x="590.0" y="562.0" font-size="11.5" fill="#6b7280" text-anchor="middle">сравнение HMAC за равное время</text><circle cx="76" cy="545.0" r="15" fill="#ffffff" stroke="#d9dde3"/><text x="76.0" y="550.0" font-size="12.5" fill="#6b7280" text-anchor="middle">5</text><text x="590.0" y="605.0" font-size="12.5" fill="#6b7280" text-anchor="middle">HMAC-SHA256(секрет, пятиминутный интервал ‖ идентификатор сервера), сравнение за равное время</text><text x="590.0" y="662.0" font-size="13.5" fill="#16181d" font-weight="700" text-anchor="middle">верной куки нет: отдаётся сайт</text><line x1="970.0" y1="676.0" x2="210.0" y2="676.0" stroke="#d1495b" stroke-width="1.9" marker-end="url(#ard1495b)"/><circle cx="76" cy="676.0" r="15" fill="#ffffff" stroke="#d9dde3"/><text x="76.0" y="681.0" font-size="12.5" fill="#6b7280" text-anchor="middle">6</text><text x="590.0" y="700.0" font-size="12.5" fill="#6b7280" text-anchor="middle">статические файлы, настоящие 200 и настоящие 404; соединение заканчивается как просмотр</text><text x="590.0" y="717.0" font-size="12.5" fill="#6b7280" text-anchor="middle">страницы</text><text x="590.0" y="757.0" font-size="13.5" fill="#16181d" font-weight="700" text-anchor="middle">кука верна: 200, тело ответа не закрывается</text><line x1="970.0" y1="771.0" x2="210.0" y2="771.0" stroke="#1f9d63" stroke-width="1.9" marker-end="url(#ar1f9d63)"/><circle cx="76" cy="771.0" r="15" fill="#ffffff" stroke="#d9dde3"/><text x="76.0" y="776.0" font-size="12.5" fill="#6b7280" text-anchor="middle">7</text><text x="590.0" y="795.0" font-size="12.5" fill="#6b7280" text-anchor="middle">тело ответа становится половиной туннеля от сервера к клиенту</text><text x="590.0" y="835.0" font-size="13.5" fill="#16181d" font-weight="700" text-anchor="middle">кадр обмена ключами, открытый ключ X25519</text><line x1="210.0" y1="849.0" x2="970.0" y2="849.0" stroke="#2f6feb" stroke-width="1.9" marker-end="url(#ar2f6feb)"/><circle cx="76" cy="849.0" r="15" fill="#ffffff" stroke="#d9dde3"/><text x="76.0" y="854.0" font-size="12.5" fill="#6b7280" text-anchor="middle">8</text><text x="590.0" y="873.0" font-size="12.5" fill="#6b7280" text-anchor="middle">32 байта в теле запроса — это половина туннеля от клиента к серверу</text><text x="590.0" y="913.0" font-size="13.5" fill="#16181d" font-weight="700" text-anchor="middle">кадр обмена ключами, открытый ключ X25519</text><line x1="970.0" y1="927.0" x2="210.0" y2="927.0" stroke="#1f9d63" stroke-width="1.9" marker-end="url(#ar1f9d63)"/><circle cx="76" cy="927.0" r="15" fill="#ffffff" stroke="#d9dde3"/><text x="76.0" y="932.0" font-size="12.5" fill="#6b7280" text-anchor="middle">9</text><text x="590.0" y="951.0" font-size="12.5" fill="#6b7280" text-anchor="middle">обе стороны выводят HKDF-SHA256(общий секрет, chameleon-session-v1) в ключ AES-256-GCM</text><text x="590.0" y="991.0" font-size="13.5" fill="#16181d" font-weight="700" text-anchor="middle">зашифрованные кадры данных</text><line x1="210.0" y1="1005.0" x2="970.0" y2="1005.0" stroke="#1f9d63" stroke-width="1.9" marker-end="url(#ar1f9d63)" marker-start="url(#ar1f9d63)"/><circle cx="76" cy="1005.0" r="15" fill="#ffffff" stroke="#d9dde3"/><text x="76.0" y="1010.0" font-size="12.5" fill="#6b7280" text-anchor="middle">10</text><text x="590.0" y="1029.0" font-size="12.5" fill="#6b7280" text-anchor="middle">в кадрах едут мультиплексированные потоки; каждой TLS-записи размер и темп задаёт профиль</text><line x1="210" y1="159" x2="210" y2="1051.0" stroke="#d9dde3" stroke-dasharray="4 5"/><line x1="970" y1="159" x2="970" y2="1051.0" stroke="#d9dde3" stroke-dasharray="4 5"/><rect x="44.0" y="1079.0" width="1092.0" height="78.0" fill="#ffffff" stroke="#d9dde3" rx="10"/><text x="590.0" y="1111.0" font-size="13.5" fill="#16181d" text-anchor="middle">Кука меняется каждые пять минут, а предыдущий интервал ещё принимается, поэтому перехваченная годится примерно десять минут.</text><text x="590.0" y="1131.0" font-size="13.5" fill="#16181d" text-anchor="middle">Неверная обходится ровно во столько же времени, сколько верная.</text></svg>