<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="708" viewBox="0 0 1180 708" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, Helvetica, Arial, sans-serif"><defs><marker id="ar6b7280" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#6b7280"/></marker><marker id="ar2f6feb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#2f6feb"/></marker><marker id="ar1f9d63" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#1f9d63"/></marker><marker id="ard1495b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#d1495b"/></marker></defs><rect width="1180" height="708" fill="#fbfbfd"/><text x="44.0" y="52.0" font-size="26" fill="#16181d" font-weight="700">Как профиль превращается в трафик</text><text x="44.0" y="80.0" font-size="15" fill="#6b7280">Профиль описывает, как настоящий сайт выглядит на проводе. Формовщик берёт размеры оттуда, а не пишет как удобнее.</text><rect x="44.0" y="113.0" width="440.0" height="418.0" fill="#ffffff" stroke="#d9dde3" rx="12"/><text x="68.0" y="147.0" font-size="17" fill="#16181d" font-weight="700">Профиль</text><text x="68.0" y="171.0" font-size="12.5" fill="#6b7280">снят с настоящего сайта утилитой chamele0nx-profiler</text><text x="68.0" y="208.0" font-size="13" fill="#16181d" font-weight="700">распределение размеров записей</text><text x="68.0" y="240.0" font-size="11.5" fill="#6b7280" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">128 Б – 1,1 КБ</text><rect x="180.9" y="228.0" width="38.4" height="16" fill="#2f6feb" opacity="0.78" rx="3"/><text x="229.3" y="240.0" font-size="11" fill="#6b7280">8%</text><text x="68.0" y="270.0" font-size="11.5" fill="#6b7280" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">1,1 – 3,4 КБ</text><rect x="180.9" y="258.0" width="67.2" height="16" fill="#2f6feb" opacity="0.78" rx="3"/><text x="258.1" y="270.0" font-size="11" fill="#6b7280">14%</text><text x="68.0" y="300.0" font-size="11.5" fill="#6b7280" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">3,4 – 9,2 КБ</text><rect x="180.9" y="288.0" width="129.5" height="16" fill="#2f6feb" opacity="0.78" rx="3"/><text x="320.4" y="300.0" font-size="11" fill="#6b7280">27%</text><text x="68.0" y="330.0" font-size="11.5" fill="#6b7280" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">9,2 – 15,6 КБ</text><rect x="180.9" y="318.0" width="244.6" height="16" fill="#2f6feb" opacity="0.78" rx="3"/><text x="435.6" y="330.0" font-size="11" fill="#6b7280">51%</text><text x="68.0" y="360.0" font-size="13" fill="#16181d" font-weight="700">рисунок всплесков</text><text x="68.0" y="382.0" font-size="12" fill="#6b7280" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">34–76 записей во всплеске</text><text x="68.0" y="401.0" font-size="12" fill="#6b7280" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">пауза 4–22 мс между всплесками</text><text x="68.0" y="420.0" font-size="12" fill="#6b7280" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">0–2 мс между записями</text><text x="68.0" y="451.0" font-size="13" fill="#16181d" font-weight="700">форма сессии (записана, пока не применяется)</text><text x="68.0" y="473.0" font-size="12" fill="#6b7280" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">отдача к приёму примерно 1 : 20</text><text x="68.0" y="492.0" font-size="12" fill="#6b7280" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">2–7 одновременных потоков</text><rect x="606.0" y="113.0" width="530.0" height="418.0" fill="#ffffff" stroke="#d9dde3" rx="12"/><text x="630.0" y="147.0" font-size="17" fill="#16181d" font-weight="700">Результат</text><text x="630.0" y="171.0" font-size="12.5" fill="#6b7280">те же байты VPN, выданные в форме, что слева</text><rect x="630.0" y="240.2" width="3" height="139.8" fill="#1f9d63" rx="0.6"/><rect x="634.2" y="364.6" width="3" height="15.4" fill="#1f9d63" rx="0.6"/><rect x="638.4" y="336.9" width="3" height="43.1" fill="#1f9d63" rx="0.6"/><rect x="642.6" y="251.0" width="3" height="129.0" fill="#1f9d63" rx="0.6"/><rect x="646.8" y="342.1" width="3" height="37.9" fill="#1f9d63" rx="0.6"/><rect x="651.0" y="294.6" width="3" height="85.4" fill="#1f9d63" rx="0.6"/><rect x="655.2" y="337.4" width="3" height="42.6" fill="#1f9d63" rx="0.6"/><rect x="659.4" y="226.1" width="3" height="153.9" fill="#1f9d63" rx="0.6"/><rect x="663.6" y="260.1" width="3" height="119.9" fill="#1f9d63" rx="0.6"/><rect x="667.8" y="260.9" width="3" height="119.1" fill="#1f9d63" rx="0.6"/><rect x="672.0" y="294.3" width="3" height="85.7" fill="#1f9d63" rx="0.6"/><rect x="676.2" y="342.1" width="3" height="37.9" fill="#1f9d63" rx="0.6"/><rect x="680.4" y="229.7" width="3" height="150.3" fill="#1f9d63" rx="0.6"/><rect x="684.6" y="223.0" width="3" height="157.0" fill="#1f9d63" rx="0.6"/><rect x="688.8" y="337.3" width="3" height="42.7" fill="#1f9d63" rx="0.6"/><rect x="693.0" y="318.5" width="3" height="61.5" fill="#1f9d63" rx="0.6"/><rect x="697.2" y="230.1" width="3" height="149.9" fill="#1f9d63" rx="0.6"/><rect x="701.4" y="234.1" width="3" height="145.9" fill="#1f9d63" rx="0.6"/><rect x="705.6" y="217.3" width="3" height="162.7" fill="#1f9d63" rx="0.6"/><rect x="709.8" y="208.6" width="3" height="171.4" fill="#1f9d63" rx="0.6"/><rect x="729.8" y="222.0" width="3" height="158.0" fill="#1f9d63" rx="0.6"/><rect x="734.0" y="293.4" width="3" height="86.6" fill="#1f9d63" rx="0.6"/><rect x="738.2" y="211.5" width="3" height="168.5" fill="#1f9d63" rx="0.6"/><rect x="742.4" y="246.6" width="3" height="133.4" fill="#1f9d63" rx="0.6"/><rect x=