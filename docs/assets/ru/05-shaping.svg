><rect x="1001.6" y="258.4" width="3" height="121.6" fill="#1f9d63" rx="0.6"/><rect x="1005.8" y="232.8" width="3" height="147.2" fill="#1f9d63" rx="0.6"/><rect x="1010.0" y="242.6" width="3" height="137.4" fill="#1f9d63" rx="0.6"/><rect x="1027.8" y="311.9" width="3" height="68.1" fill="#1f9d63" rx="0.6"/><rect x="1032.0" y="204.9" width="3" height="175.1" fill="#1f9d63" rx="0.6"/><rect x="1036.2" y="215.6" width="3" height="164.4" fill="#1f9d63" rx="0.6"/><rect x="1040.4" y="219.6" width="3" height="160.4" fill="#1f9d63" rx="0.6"/><rect x="1044.6" y="296.3" width="3" height="83.7" fill="#1f9d63" rx="0.6"/><rect x="1048.8" y="322.1" width="3" height="57.9" fill="#1f9d63" rx="0.6"/><rect x="1053.0" y="371.3" width="3" height="8.7" fill="#1f9d63" rx="0.6"/><rect x="1057.2" y="287.1" width="3" height="92.9" fill="#1f9d63" rx="0.6"/><rect x="1061.4" y="237.1" width="3" height="142.9" fill="#1f9d63" rx="0.6"/><rect x="1065.6" y="204.7" width="3" height="175.3" fill="#1f9d63" rx="0.6"/><rect x="1069.8" y="242.0" width="3" height="138.0" fill="#1f9d63" rx="0.6"/><rect x="1074.0" y="311.7" width="3" height="68.3" fill="#1f9d63" rx="0.6"/><rect x="1078.2" y="312.9" width="3" height="67.1" fill="#1f9d63" rx="0.6"/><rect x="1082.4" y="210.0" width="3" height="170.0" fill="#1f9d63" rx="0.6"/><rect x="1086.6" y="235.1" width="3" height="144.9" fill="#1f9d63" rx="0.6"/><rect x="1090.8" y="216.0" width="3" height="164.0" fill="#1f9d63" rx="0.6"/><rect x="1095.0" y="334.4" width="3" height="45.6" fill="#1f9d63" rx="0.6"/><rect x="1099.2" y="217.0" width="3" height="163.0" fill="#1f9d63" rx="0.6"/><rect x="1103.4" y="235.2" width="3" height="144.8" fill="#1f9d63" rx="0.6"/><rect x="1107.6" y="282.0" width="3" height="98.0" fill="#1f9d63" rx="0.6"/><line x1="630" y1="381.0" x2="1112" y2="381.0" stroke="#d9dde3"/><text x="1112.0" y="402.0" font-size="11" fill="#6b7280" text-anchor="end">время →</text><text x="630.0" y="442.0" font-size="13" fill="#16181d" font-weight="700">Проверяется, а не предполагается</text><text x="630.0" y="464.0" font-size="12.5" fill="#6b7280">chamele0nx-validator гоняет критерий Колмогорова — Смирнова и</text><text x="630.0" y="482.0" font-size="12.5" fill="#6b7280">хи-квадрат по тому, что выдал формовщик. Результат, не прошедший</text><text x="630.0" y="500.0" font-size="12.5" fill="#6b7280">собственный профиль, — это регресс, даже если стало быстрее.</text><line x1="506.0" y1="322.0" x2="584.0" y2="322.0" stroke="#6b7280" stroke-width="2" marker-end="url(#ar6b7280)"/><text x="545.0" y="308.0" font-size="12.5" fill="#16181d" font-weight="700" text-anchor="middle">формовщик</text><text x="545.0" y="348.0" font-size="11.5" fill="#6b7280" text-anchor="middle">режет и задаёт</text><text x="545.0" y="364.0" font-size="11.5" fill="#6b7280" text-anchor="middle">темп записи</text><rect x="44.0" y="565.0" width="1092.0" height="109.0" fill="#fff7ed" stroke="#b7791f" stroke-opacity="0.45" rx="10"/><text x="70.0" y="597.0" font-size="14" fill="#16181d" font-weight="700">Почему настоящие профили не лежат в этом репозитории</text><text x="70.0" y="619.0" font-size="13" fill="#6b7280">Опубликованный профиль прямо указывает цензору, против какого сайта строить классификатор. Снимите свой с сайта, подходящего вашему</text><text x="70.0" y="638.0" font-size="13" fill="#6b7280">домену, и держите при себе. Примеры в deploy/profiles написаны для этого репозитория как иллюстрации и ни с какого сайта не сняты: запустите</text><text x="70.0" y="657.0" font-size="13" fill="#6b7280">такой как есть — получите ту же форму, что и все остальные читатели.</text></svg>