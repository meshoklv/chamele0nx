<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="907" viewBox="0 0 1180 907" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, Helvetica, Arial, sans-serif"><defs><marker id="ar6b7280" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#6b7280"/></marker><marker id="ar2f6feb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#2f6feb"/></marker><marker id="ar1f9d63" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#1f9d63"/></marker><marker id="ard1495b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#d1495b"/></marker></defs><rect width="1180" height="907" fill="#fbfbfd"/><text x="44.0" y="52.0" font-size="26" fill="#16181d" font-weight="700">How a request travels</text><text x="44.0" y="80.0" font-size="15" fill="#6b7280">The same connection is a working website and a VPN tunnel. Which one you get depends on whether you hold the secret.</text><rect x="44.0" y="113.0" width="356.0" height="655.0" fill="#ffffff" stroke="#d9dde3" rx="12"/><text x="68.0" y="151.0" font-size="17" fill="#16181d" font-weight="700">Client</text><rect x="64.0" y="175.0" width="316.0" height="61.0" fill="#f4f6fa" stroke="#d9dde3" rx="8"/><text x="80.0" y="203.0" font-size="14" fill="#16181d" font-weight="700">Application</text><text x="80.0" y="219.0" font-size="12" fill="#6b7280">browser, messenger, anything</text><line x1="222.0" y1="240.0" x2="222.0" y2="250.0" stroke="#6b7280" stroke-width="1.4" marker-end="url(#ar6b7280)"/><rect x="64.0" y="254.0" width="316.0" height="61.0" fill="#f4f6fa" stroke="#d9dde3" rx="8"/><text x="80.0" y="282.0" font-size="14" fill="#16181d" font-weight="700">SOCKS5 or packet tunnel</text><text x="80.0" y="298.0" font-size="12" fill="#6b7280">TCP and UDP are both accepted</text><line x1="222.0" y1="319.0" x2="222.0" y2="329.0" stroke="#6b7280" stroke-width="1.4" marker-end="url(#ar6b7280)"/><rect x="64.0" y="333.0" width="316.0" height="61.0" fill="#f4f6fa" stroke="#d9dde3" rx="8"/><text x="80.0" y="361.0" font-size="14" fill="#16181d" font-weight="700">Multiplexer</text><text x="80.0" y="377.0" font-size="12" fill="#6b7280">many logical streams inside one tunnel</text><line x1="222.0" y1="398.0" x2="222.0" y2="408.0" stroke="#6b7280" stroke-width="1.4" marker-end="url(#ar6b7280)"/><rect x="64.0" y="412.0" width="316.0" height="78.0" fill="#f4f6fa" stroke="#d9dde3" rx="8"/><text x="80.0" y="440.0" font-size="14" fill="#16181d" font-weight="700">Encryption</text><text x="80.0" y="456.0" font-size="12" fill="#6b7280">X25519 exchange, then AES-256-GCM per</text><text x="80.0" y="473.0" font-size="12" fill="#6b7280">frame</text><line x1="222.0" y1="494.0" x2="222.0" y2="504.0" stroke="#6b7280" stroke-width="1.4" marker-end="url(#ar6b7280)"/><rect x="64.0" y="508.0" width="316.0" height="78.0" fill="#f4f6fa" stroke="#d9dde3" rx="8"/><text x="80.0" y="536.0" font-size="14" fill="#16181d" font-weight="700">Cover</text><text x="80.0" y="552.0" font-size="12" fill="#6b7280">frames ride inside an HTTP/2 POST to a real</text><text x="80.0" y="569.0" font-size="12" fill="#6b7280">API path</text><line x1="222.0" y1="590.0" x2="222.0" y2="600.0" stroke="#6b7280" stroke-width="1.4" marker-end="url(#ar6b7280)"/><rect x="64.0" y="604.0" width="316.0" height="61.0" fill="#f4f6fa" stroke="#d9dde3" rx="8"/><text x="80.0" y="632.0" font-size="14" fill="#16181d" font-weight="700">Record shaping</text><text x="80.0" y="648.0" font-size="12" fill="#6b7280">sizes and pauses drawn from a traffic profile</text><line x1="222.0" y1="669.0" x2="222.0" y2="679.0" stroke="#6b7280" stroke-width="1.4" marker-end="url(#ar6b7280)"/><rect x="64.0" y="683.0" width="316.0" height="61.0" fill="#f4f6fa" stroke="#d9dde3" rx="8"/><text x="80.0" y="711.0" font-size="14" fill="#16181d" font-weight="700">uTLS</text><text x="80.0" y="727.0" font-size="12" fill="#6b7280">byte-exact Chrome TLS handshake</text><rect x="780.0" y="113.0" width="356.0" height="655.0" fill="#ffffff" stroke="#d9dde3" rx="12"/><text x="804.0" y="151.0" font-size="17" fill="#16181d" font-weight="700">Server</text><rect x="800.0" y="175.0" width="316.0" height="97.7" fill="#f4f6fa" stroke="#d9dde3" rx="8"/><text x="816.0" y="221.4" font-size="14" fill="#16181d" font-weight="700">TLS termination</text><text x="816.0" y="237.4" font-size="12" fill="#6b7280">port 443, a real certificate for a real domain</text><line x1="958.0" y1="276.7" x2="958.0" y2="316.8" stroke="#6b7280" stroke-width="1.4" marker-end="url(#ar6b7280)"/><rect x="800.0" y="320.8" width="316.0" height="114.7" fill="#f4f6fa" stroke="#d9dde3" rx="8"/><text x="816.0" y="367.1" font-size="14" fill="#16181d" font-weight="700">Is there a valid session cookie?</text><text x="816.0" y="383.1" font-size="12" fill="#6b7280">HMAC over a 5-minute time bucket, checked in</text><text x="816.0" y="400.1" font-size="12" fill="#6b7280">constant time</text><line x1="958.0" y1="439.5" x2="958.0" y2="479.5" stroke="#6b7280" stroke-width="1.4" marker-end="url(#ar6b7280)"/><rect x="800.0" y="483.5" width="316.0" height="97.7" fill="#f1f6ff" stroke="#2f6feb" stroke-opacity="0.6" rx="8"/><text x="816.0" y="529.9" font-size="14" fill="#16181d" font-weight="700">No: serve the website</text><text x="816.0" y="545.9" font-size="12" fill="#6b7280">static site, ordinary responses, ordinary 404s</text><line x1="958.0" y1="585.2" x2="958.0" y2="625.3" stroke="#6b7280" stroke-width="1.4" marker-end="url(#ar6b7280)"/><rect x="800.0" y="629.3" width="316.0" height="114.7" fill="#f0fbf5" stroke="#1f9d63" stroke-opacity="0.6" rx="8"/><text x="816.0" y="675.6" font-size="14" fill="#16181d" font-weight="700">Yes: serve the tunnel</text><text x="816.0" y="691.6" font-size="12" fill="#6b7280">decrypt, demultiplex, open TCP and UDP to the</text><text x="816.0" y="708.6" font-size="12" fill="#6b7280">internet</text><rect x="440.0" y="290.5" width="300.0" height="300.0" fill="#fff7ed" stroke="#b7791f" stroke-opacity="0.45" rx="12"/><text x="590.0" y="324.5" font-size="15" fill="#b7791f" font-weight="700" text-anchor="middle">The censor, in the middle</text><text x="458.0" y="362.5" font-size="12.5" fill="#16181d" font-weight="700">What it can see:</text><text x="458.0" y="388.5" font-size="12.5" fill="#6b7280">• a TLS 1.3 connection to a real domain</text><text x="469.4" y="406.5" font-size="12.5" fill="#6b7280">with a valid certificate</text><text x="458.0" y="434.5" font-size="12.5" fill="#6b7280">• a Chrome handshake fingerprint</text><text x="458.0" y="462.5" font-size="12.5" fill="#6b7280">• record sizes and pauses that match</text><text x="469.4" y="480.5" font-size="12.5" fill="#6b7280">ordinary web browsing</text><text x="458.0" y="524.5" font-size="12.5" fill="#16181d" font-weight="700">What it cannot see:</text><text x="458.0" y="550.5" font-size="12.5" fill="#6b7280">• that any of this is a tunnel</text><line x1="408.0" y1="440.5" x2="432.0" y2="440.5" stroke="#6b7280" stroke-width="2" marker-end="url(#ar6b7280)"/><line x1="748.0" y1="440.5" x2="772.0" y2="440.5" stroke="#6b7280" stroke-width="2" marker-end="url(#ar6b7280)"/><rect x="44.0" y="802.0" width="1092.0" height="71.0" fill="#ffffff" stroke="#d9dde3" rx="10"/><text x="70.0" y="832.0" font-size="14" fill="#16181d" font-weight="700">The point</text><text x="70.0" y="854.0" font-size="13" fill="#6b7280">An active prober that connects without the secret is not refused and not redirected. It is served the website, because the website is genuinely there.</text></svg>