<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="1174" viewBox="0 0 1180 1174" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, Helvetica, Arial, sans-serif"><defs><marker id="ar6b7280" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#6b7280"/></marker><marker id="ar2f6feb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#2f6feb"/></marker><marker id="ar1f9d63" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#1f9d63"/></marker><marker id="ard1495b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#d1495b"/></marker></defs><rect width="1180" height="1174" fill="#fbfbfd"/><text x="44.0" y="52.0" font-size="26" fill="#16181d" font-weight="700">Connecting, step by step</text><text x="44.0" y="80.0" font-size="15" fill="#6b7280">There is no login screen and no handshake of our own before TLS. Everything up to the cookie check is an ordinary HTTPS page load.</text><rect x="110.0" y="113.0" width="200.0" height="46.0" fill="#ffffff" stroke="#d9dde3" rx="9"/><text x="210.0" y="143.0" font-size="15" fill="#16181d" font-weight="700" text-anchor="middle">Client</text><rect x="870.0" y="113.0" width="200.0" height="46.0" fill="#ffffff" stroke="#d9dde3" rx="9"/><text x="970.0" y="143.0" font-size="15" fill="#16181d" font-weight="700" text-anchor="middle">Server</text><text x="590.0" y="219.0" font-size="13.5" fill="#16181d" font-weight="700" text-anchor="middle">TCP connect to port 443</text><line x1="210.0" y1="233.0" x2="970.0" y2="233.0" stroke="#2f6feb" stroke-width="1.9" marker-end="url(#ar2f6feb)"/><circle cx="76" cy="233.0" r="15" fill="#ffffff" stroke="#d9dde3"/><text x="76.0" y="238.0" font-size="12.5" fill="#6b7280" text-anchor="middle">1</text><text x="590.0" y="257.0" font-size="12.5" fill="#6b7280" text-anchor="middle">nothing unusual: this is the port every website uses</text><text x="590.0" y="297.0" font-size="13.5" fill="#16181d" font-weight="700" text-anchor="middle">TLS ClientHello</text><line x1="210.0" y1="311.0" x2="970.0" y2="311.0" stroke="#2f6feb" stroke-width="1.9" marker-end="url(#ar2f6feb)"/><circle cx="76" cy="311.0" r="15" fill="#ffffff" stroke="#d9dde3"/><text x="76.0" y="316.0" font-size="12.5" fill="#6b7280" text-anchor="middle">2</text><text x="590.0" y="335.0" font-size="12.5" fill="#6b7280" text-anchor="middle">produced by uTLS, byte-identical to a real Chrome handshake; the SNI is the real domain</text><text x="590.0" y="375.0" font-size="13.5" fill="#16181d" font-weight="700" text-anchor="middle">ServerHello and certificate</text><line x1="970.0" y1="389.0" x2="210.0" y2="389.0" stroke="#1f9d63" stroke-width="1.9" marker-end="url(#ar1f9d63)"/><circle cx="76" cy="389.0" r="15" fill="#ffffff" stroke="#d9dde3"/><text x="76.0" y="394.0" font-size="12.5" fill="#6b7280" text-anchor="middle">3</text><text x="590.0" y="413.0" font-size="12.5" fill="#6b7280" text-anchor="middle">a genuine certificate for a genuine domain, issued by a public CA</text><text x="590.0" y="453.0" font-size="13.5" fill="#16181d" font-weight="700" text-anchor="middle">HTTP/2 POST /api/v1/events</text><line x1="210.0" y1="467.0" x2="970.0" y2="467.0" stroke="#2f6feb" stroke-width="1.9" marker-end="url(#ar2f6feb)"/><circle cx="76" cy="467.0" r="15" fill="#ffffff" stroke="#d9dde3"/><text x="76.0" y="472.0" font-size="12.5" fill="#6b7280" text-anchor="middle">4</text><text x="590.0" y="491.0" font-size="12.5" fill="#6b7280" text-anchor="middle">Cookie: wordpress_logged_in_&lt;hash&gt;=&lt;token&gt; — header order and User-Agent copied from Chrome</text><rect x="441.6" y="513.0" width="296.9" height="64.0" fill="#fffaf0" stroke="#b7791f" stroke-opacity="0.55" rx="9"/><text x="590.0" y="540.0" font-size="14" fill="#16181d" font-weight="700" text-anchor="middle">the server checks the cookie</text><text x="590.0" y="562.0" font-size="11.5" fill="#6b7280" text-anchor="middle">constant-time HMAC comparison</text><circle cx="76" cy="545.0" r="15" fill="#ffffff" stroke="#d9dde3"/><text x="76.0" y="550.0" font-size="12.5" fill="#6b7280" text-anchor="middle">5</text><text x="590.0" y="605.0" font-size="12.5" fill="#6b7280" text-anchor="middle">HMAC-SHA256(secret, 5-minute bucket ‖ server id), compared in constant time</text><text x="590.0" y="662.0" font-size="13.5" fill="#16181d" font-weight="700" text-anchor="middle">no valid cookie: the website</text><line x1="970.0" y1="676.0" x2="210.0" y2="676.0" stroke="#d1495b" stroke-width="1.9" marker-end="url(#ard1495b)"/><circle cx="76" cy="676.0" r="15" fill="#ffffff" stroke="#d9dde3"/><text x="76.0" y="681.0" font-size="12.5" fill="#6b7280" text-anchor="middle">6</text><text x="590.0" y="700.0" font-size="12.5" fill="#6b7280" text-anchor="middle">static files, real 200s and real 404s; the connection ends as an ordinary page view</text><text x="590.0" y="740.0" font-size="13.5" fill="#16181d" font-weight="700" text-anchor="middle">valid cookie: 200, body left open</text><line x1="970.0" y1="754.0" x2="210.0" y2="754.0" stroke="#1f9d63" stroke-width="1.9" marker-end="url(#ar1f9d63)"/><circle cx="76" cy="754.0" r="15" fill="#ffffff" stroke="#d9dde3"/><text x="76.0" y="759.0" font-size="12.5" fill="#6b7280" text-anchor="middle">7</text><text x="590.0" y="778.0" font-size="12.5" fill="#6b7280" text-anchor="middle">the response body becomes the server-to-client half of the tunnel</text><text x="590.0" y="818.0" font-size="13.5" fill="#16181d" font-weight="700" text-anchor="middle">key exchange frame, X25519 public key</text><line x1="210.0" y1="832.0" x2="970.0" y2="832.0" stroke="#2f6feb" stroke-width="1.9" marker-end="url(#ar2f6feb)"/><circle cx="76" cy="832.0" r="15" fill="#ffffff" stroke="#d9dde3"/><text x="76.0" y="837.0" font-size="12.5" fill="#6b7280" text-anchor="middle">8</text><text x="590.0" y="856.0" font-size="12.5" fill="#6b7280" text-anchor="middle">32 bytes on the request body, which is the client-to-server half</text><text x="590.0" y="896.0" font-size="13.5" fill="#16181d" font-weight="700" text-anchor="middle">key exchange frame, X25519 public key</text><line x1="970.0" y1="910.0" x2="210.0" y2="910.0" stroke="#1f9d63" stroke-width="1.9" marker-end="url(#ar1f9d63)"/><circle cx="76" cy="910.0" r="15" fill="#ffffff" stroke="#d9dde3"/><text x="76.0" y="915.0" font-size="12.5" fill="#6b7280" text-anchor="middle">9</text><text x="590.0" y="934.0" font-size="12.5" fill="#6b7280" text-anchor="middle">both sides derive HKDF-SHA256(shared secret, chameleon-session-v1) into an AES-256-GCM key</text><text x="590.0" y="974.0" font-size="13.5" fill="#16181d" font-weight="700" text-anchor="middle">encrypted data frames</text><line x1="210.0" y1="988.0" x2="970.0" y2="988.0" stroke="#1f9d63" stroke-width="1.9" marker-end="url(#ar1f9d63)" marker-start="url(#ar1f9d63)"/><circle cx="76" cy="988.0" r="15" fill="#ffffff" stroke="#d9dde3"/><text x="76.0" y="993.0" font-size="12.5" fill="#6b7280" text-anchor="middle">10</text><text x="590.0" y="1012.0" font-size="12.5" fill="#6b7280" text-anchor="middle">each frame carries multiplexed streams; every TLS record is sized and paced from the profile</text><line x1="210" y1="159" x2="210" y2="1034.0" stroke="#d9dde3" stroke-dasharray="4 5"/><line x1="970" y1="159" x2="970" y2="1034.0" stroke="#d9dde3" stroke-dasharray="4 5"/><rect x="44.0" y="1062.0" width="1092.0" height="78.0" fill="#ffffff" stroke="#d9dde3" rx="10"/><text x="590.0" y="1094.0" font-size="13.5" fill="#16181d" text-anchor="middle">The cookie rotates every five minutes and the previous window is still accepted, so a captured one is replayable for about ten minutes. A wrong one</text><text x="590.0" y="1114.0" font-size="13.5" fill="#16181d" text-anchor="middle">costs exactly as much time as a right one.</text></svg>