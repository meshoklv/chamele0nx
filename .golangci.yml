version: "2"

run:
  timeout: 5m

linters:
  default: standard
  enable:
    - bodyclose
    - errorlint
    - gocritic
    - misspell
    - nilerr
    - revive
    - unconvert
    - unparam
    - usestdlibvars
    - wastedassign

  settings:
    revive:
      rules:
        - name: exported
          disabled: false
    gocritic:
      disabled-checks:
        - commentFormatting

  exclusions:
    rules:
      # Table-driven tests are allowed to be long and repetitive.
      - path: _test\.go
        linters:
          - errcheck
          - gocritic
          - unparam

formatters:
  enable:
    - gofmt
    - goimports
