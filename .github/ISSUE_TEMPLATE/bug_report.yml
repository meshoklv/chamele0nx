name: Bug report
description: Something behaves differently than documented
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        **Stop if this is a security problem** — anything that helps a censor
        detect or block this traffic goes through a private advisory instead.
        See SECURITY.md.
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected, what you got instead.
    validations: { required: true }
  - type: textarea
    id: repro
    attributes:
      label: Reproduction
      description: The smallest set of commands that shows the problem.
      render: shell
    validations: { required: true }
  - type: input
    id: version
    attributes:
      label: Version
      description: Output of `chamele0nx-server -version` or the commit hash.
    validations: { required: true }
  - type: dropdown
    id: side
    attributes:
      label: Which side
      options: [server, client, mobile binding, tools, unclear]
    validations: { required: true }
  - type: textarea
    id: env
    attributes:
      label: Environment
      description: OS and version, Go version, how the server is deployed.
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: |
        Relevant log output. Remove anything identifying — addresses,
        secrets, cookies — before pasting.
      render: shell
