name: Feature request
description: Propose a change or addition
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: What situation does this address? Describe the situation, not the solution.
    validations: { required: true }
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: What you would build.
    validations: { required: true }
  - type: dropdown
    id: wire
    attributes:
      label: Does this change the wire format?
      description: Frame types, headers, key derivation, cookie formats, handshake.
      options: ["No", "Yes", "Not sure"]
    validations: { required: true }
  - type: textarea
    id: detectability
    attributes:
      label: Effect on detectability
      description: |
        How does this change what an observer sees? A change that makes the
        traffic more regular or more predictable needs a strong argument.
    validations: { required: true }
